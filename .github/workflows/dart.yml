name: dart

on:
  push:
    branches: [main]
    paths: ["dart/**", "spec/**", ".github/workflows/dart.yml"]
  pull_request:
    paths: ["dart/**", "spec/**", ".github/workflows/dart.yml"]

permissions:
  contents: read

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages
      - name: Analyze modelport
        run: dart analyze --fatal-infos packages/modelport
      - name: Create the example's asset folders (filled by tool/copy_bundle.sh locally)
        run: |
          base=packages/modelport_onnx/example/assets
          mkdir -p "$base/images"
          for dir in "" onnx-fp32 onnx-fp16 onnx-int8 golden; do
            mkdir -p "$base/models/mobilenet_v3_small/$dir"
          done
          base=packages/modelport_executorch/example/assets
          mkdir -p "$base/images" "$base/models/mobilenet_v3_small/executorch-xnnpack-fp32" "$base/models/mobilenet_v3_small/golden"
      - name: Analyze Flutter packages and example
        run: |
          for dir in packages/modelport_flutter packages/modelport_onnx packages/modelport_onnx/example packages/modelport_executorch packages/modelport_executorch/example; do
            (cd "$dir" && flutter analyze --fatal-infos)
          done
      - name: Test modelport
        working-directory: dart/packages/modelport
        run: dart test
      - name: Test Flutter packages
        run: |
          for dir in packages/modelport_flutter packages/modelport_onnx packages/modelport_executorch; do
            (cd "$dir" && flutter test)
          done
