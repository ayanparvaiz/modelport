name: dart

on:
  push:
    branches: [main]
    paths: ["dart/**", "spec/**", ".github/workflows/dart.yml"]
  pull_request:
    paths: ["dart/**", "spec/**", ".github/workflows/dart.yml"]

permissions:
  contents: read

concurrency:
  group: dart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages
      - name: Analyze modelport
        run: dart analyze --fatal-infos packages/modelport
      - name: Analyze modelport_flutter
        working-directory: dart/packages/modelport_flutter
        run: flutter analyze --fatal-infos
      - name: Test modelport
        working-directory: dart/packages/modelport
        run: dart test
      - name: Test modelport_flutter
        working-directory: dart/packages/modelport_flutter
        run: flutter test
