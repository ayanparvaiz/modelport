  - llama-cpp
  - gguf
  - on-device

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  llm_llamacpp: ^0.7.0
  modelport: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
