name: modelport
description: >-
  Run AI models in Dart and Flutter apps from a modelport.json manifest:
  download, verify, preprocess, run, and postprocess with one API.
version: 0.1.0-dev.1
repository: https://github.com/ayanparvaiz/modelport
issue_tracker: https://github.com/ayanparvaiz/modelport/issues
topics:
  - ai
  - machine-learning
  - onnx
  - llm
  - on-device

environment:
  sdk: ^3.8.0

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  image: ^4.10.1
  meta: ^1.19.0
  path: ^1.9.1
