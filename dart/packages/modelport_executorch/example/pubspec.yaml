name: modelport_executorch_example
description: Runs a ModelPort bundle with the ExecuTorch adapter and checks it against Python.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  modelport_executorch: ^0.1.0-dev.1
  modelport_flutter: ^0.1.0-dev.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Filled by tool/copy_bundle.sh, see README.md.
  assets:
    - assets/images/
    - assets/models/mobilenet_v3_small/
    - assets/models/mobilenet_v3_small/executorch-xnnpack-fp32/
    - assets/models/mobilenet_v3_small/golden/
