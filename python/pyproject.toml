[project]
name = "modelport"
version = "0.1.0"
description = "Prepare PyTorch, Hugging Face, and GGUF models for Flutter apps: export, verify, pack, publish."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ayan Parvaiz" }]
keywords = ["flutter", "dart", "onnx", "executorch", "gguf", "on-device", "mobile", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/ayanparvaiz/modelport"
Documentation = "https://ayanparvaiz.github.io/modelport/"
Issues = "https://github.com/ayanparvaiz/modelport/issues"
Changelog = "https://github.com/ayanparvaiz/modelport/blob/main/python/CHANGELOG.md"

[project.scripts]
modelport = "modelport.cli:app"

[project.optional-dependencies]
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.5",
    "torch>=2.9",
]
gguf = [
    "gguf>=0.17",
]
executorch = [
    "executorch>=1.0",
    "torch>=2.9",
]
torchvision = [
    "torch>=2.9",
    "torchvision>=0.24",
]
hf = [
    "huggingface-hub>=0.30",
    "torch>=2.9",
    "transformers>=4.50",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.22",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "onnx>=1.17",
  "gguf>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelport"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# torch, torchvision, transformers, and executorch are optional extras that the
# light CI job does not install. Missing imports are warnings there; locally, with
# `uv sync --all-extras`, pyright sees and checks them.
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
